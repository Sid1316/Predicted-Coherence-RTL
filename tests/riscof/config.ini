# RISCOF configuration (docs/exec.md M5.3). Run from this directory: make riscof.
# Paths are relative to tests/riscof/.
[RISCOF]
ReferencePlugin=pymodel
ReferencePluginPath=pymodel
DUTPlugin=rv_core
DUTPluginPath=rv_core

[rv_core]
pluginpath=rv_core
ispec=rv_core/rv_core_isa.yaml
pspec=rv_core/rv_core_platform.yaml
target_run=1

[pymodel]
pluginpath=pymodel
